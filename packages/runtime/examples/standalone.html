<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrollix Runtime Example</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #05070f;
      }

      body {
        display: grid;
        place-items: stretch;
      }

      .demo-shell {
        width: 100%;
        height: 100%;
        min-height: 420px;
      }
    </style>
  </head>
  <body>
    <div class="demo-shell">
      <scrollix-cards project-id="YOUR_PROJECT_ID"></scrollix-cards>
    </div>

    <script type="module" src="../dist/scrollix-runtime.js"></script>
    <script>
      window.ScrollixRuntime.init({
        supabaseUrl: 'https://YOUR-PROJECT.supabase.co',
        supabaseAnonKey: 'YOUR_SUPABASE_ANON_KEY',
        storiesTable: 'stories'
      })
    </script>
  </body>
</html>
